<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — MedUnited CRM</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>

        <div class="main-col">
            <header class="topbar">
                <div>
                    <h1>User Accounts</h1>
                    <p class="subtitle">Create and manage team logins</p>
                </div>
                <div class="topbar-actions">
                    <button id="new-user-btn" type="button">+ New User</button>
                </div>
            </header>

            <main>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Active</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                    <div id="users-empty" class="empty-state hidden">No users yet.</div>
                </div>
            </main>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="form-popup" id="user-popup">
        <h3 id="popup-title">New User</h3>
        <div id="popup-error" class="form-error"></div>
        <form id="user-form">
            <input type="hidden" id="user-id">

            <label for="user-name">Full Name</label>
            <input type="text" id="user-name" required>

            <label for="user-email">Email</label>
            <input type="email" id="user-email" required>

            <label for="user-role">Role</label>
            <select id="user-role">
                <option value="agent">Agent</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
            </select>

            <label for="user-password" id="password-label">Temporary Password</label>
            <input type="text" id="user-password" placeholder="At least 8 characters" autocomplete="new-password">
            <p id="password-hint" style="font-size:0.8em;color:var(--text-muted);margin:-10px 0 14px;">Leave blank to keep the current password.</p>

            <div class="popup-actions">
                <button type="button" class="secondary" id="popup-cancel">Cancel</button>
                <button type="submit" id="popup-save">Save User</button>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
