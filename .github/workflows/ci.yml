name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
