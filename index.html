<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MedUnited Sales CRM</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand"><span class="logo-mark">M</span></div>
            <h1>MedUnited CRM</h1>
            <p class="subtitle">Medpass &amp; Pharmacy sales tracking</p>

            <div id="login-error" class="form-error"></div>
            <div id="login-info" class="form-error" style="background:#eff6ff;color:#1e40af;"></div>

            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" id="login-btn">Log in</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
